name: Bug report
description: Report a problem with a Banana Factory Frenzy beta build.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Banana Factory Frenzy.

        **Everything in this issue is public.** Please do not include personal information, save files, account details or other sensitive data, and check screenshots before attaching them.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on the release you installed, for example 0.1.0-beta.1.
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: e.g. Samsung Galaxy A16, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the game
        2. Tap ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: repeatable
    attributes:
      label: Does it happen repeatedly?
      options:
        - "Yes, every time"
        - "Sometimes"
        - "Only once so far"
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here if it helps. Make sure it shows nothing personal.
    validations:
      required: false
